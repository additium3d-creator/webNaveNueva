services:
  - type: web
    name: nave-davinci16
    runtime: node
    plan: free                 # las versiones viven en Supabase: no hace falta disco
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ACCESS_CODE
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: SUPABASE_URL
        value: https://bxndeeoxvkqikmfcmook.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
