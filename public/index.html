<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nave Da Vinci 16 · Additium3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/assets/logo.png">
</head>
<body>
<div class="app">
  <header class="top">
    <img class="logo" src="/assets/logo.png" alt="Additium3D">
    <div class="proj">
      <span class="eyebrow">Nave · Leonardo Da Vinci 16 · Paterna</span>
      <b id="viewing">Cargando…</b>
    </div>
    <div class="seg" role="tablist" aria-label="Sección"><button data-sec="3d" class="on" role="tab">Visor 3D</button><button data-sec="foto" role="tab">Vistas generales</button></div>
    <nav class="topnav">
      <button id="btnHist" class="ghost">Historial <span id="vcount" class="count"></span></button>
      <button id="btnWho" class="who" title="Cambiar nombre"><i></i><span id="who">—</span></button>
    </nav>
  </header>

  <main class="stage">
    <iframe id="viewer" title="Visor 3D de la nave" allow="fullscreen"></iframe>
    <div id="sceneErr" class="scene-err" hidden></div>
    <div id="loading" class="loading"><span></span>Cargando escena</div>
    <div id="peek" class="peek" hidden><span id="peekTxt"></span><button id="peekBack" class="ghost">Volver</button></div>
    <div id="pick" class="pick" hidden><span id="pickTxt">Haz clic en la escena para marcar un punto · Esc para terminar</span></div>
  </main>

  <section id="gallery" class="gallery" hidden>
    <div class="gal-top">
      <div class="gal-title"><span class="eyebrow">Fotografía · ajena al visor 3D</span><h1>Vistas generales de la nave</h1><span id="galCount" class="gal-count"></span></div>
      <div class="gal-tools">
        <label class="sel"><span>Versión de la nave</span><select id="galVer"></select></label>
        <label class="sel"><span>Resolución</span><select id="galRes"><option value="hd">1920×1080</option><option value="qhd">2560×1440</option><option value="uhd">3840×2160 (4K)</option></select></label>
        <button id="galGen" class="primary">Generar las 10 vistas</button>
        <button id="galNew" class="ghost">Vista nueva</button>
        <button id="galZip" class="ghost" disabled>Descargar todas (ZIP)</button>
      </div>
      <div id="galProg" class="gal-prog" hidden><span></span><div><i></i></div></div>
    </div>
    <div id="galStd" class="gal-grid"></div>
    <h2 id="galCustomHead" class="gal-h" hidden>Vistas nuevas</h2>
    <div id="galCustom" class="gal-grid"></div>
  </section>

  <section id="dock" class="dock">
    <div class="dock-head">
      <div class="state"><i id="dot" class="dot"></i><span id="state">Viendo la última versión</span></div>
      <div class="actions">
        <button id="btnUndo" class="ghost" disabled>Deshacer</button>
        <button id="btnDiscard" class="ghost" disabled>Descartar</button>
        <button id="btnSave" class="primary" disabled>Guardar versión</button>
        <button id="btnFold" class="icon" aria-label="Plegar panel" title="Plegar panel">▾</button>
      </div>
    </div>
    <div id="log" class="log" aria-live="polite"></div>
    <div id="pins" class="pins"></div>
    <div id="meas" class="pins"></div>
    <div id="thumbs" class="thumbs"></div>
    <form id="composer" class="composer">
      <textarea id="msg" rows="1" placeholder="Describe el cambio. Ej.: «Pon un banco de trabajo de 2 m junto a las Fuse, sin tapar el paso»"></textarea>
      <input id="fileIn" type="file" accept="image/*" multiple hidden>
      <button id="btnAttach" class="pickbtn" type="button" title="Adjuntar fotos (también puedes arrastrarlas o pegarlas)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5 12.6 19.9a5.5 5.5 0 0 1-7.8-7.8L13.2 3.7a3.7 3.7 0 0 1 5.2 5.2l-8.4 8.4a1.8 1.8 0 0 1-2.6-2.6L15 7.1"/></svg><span>Foto</span></button>
      <button id="btnPick" class="pickbtn" type="button" title="Señalar puntos en la escena"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg><span>Señalar</span></button>
      <button id="btnMeasure" class="pickbtn" type="button" title="Medir distancias en la escena"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17 17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span>Medir</span></button>
      <button id="btnSend" class="send" type="submit">Enviar</button>
    </form>
  </section>
  <footer class="foot"><span id="build">…</span><span id="adm"></span></footer>
</div>

<aside id="hist" class="drawer" hidden>
  <div class="drawer-head"><div><span class="eyebrow">Trazabilidad</span><h2>Historial de versiones</h2></div><button id="histClose" class="icon" aria-label="Cerrar">✕</button></div>
  <div id="tabs" class="tabs" hidden><button data-tab="v" class="on">Versiones</button><button data-tab="s">Pruebas del equipo <span id="scount" class="count"></span></button></div>
  <ol id="vlist" class="vlist"></ol>
  <ol id="slist" class="vlist" hidden></ol>
</aside>

<iframe id="shooter" class="shooter" title="" aria-hidden="true" tabindex="-1"></iframe>
<div id="lb" class="lb" hidden><button id="lbClose" class="icon" aria-label="Cerrar">✕</button><button id="lbPrev" class="lbnav l" aria-label="Anterior">‹</button><figure><img alt=""><figcaption><b id="lbTitle"></b><span id="lbPos"></span><a id="lbDl" class="primary" download>Descargar</a></figcaption></figure><button id="lbNext" class="lbnav r" aria-label="Siguiente">›</button></div>
<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><div id="modalBody"></div></div></div>
<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
<script src="/gallery.js"></script>
</body>
</html>
